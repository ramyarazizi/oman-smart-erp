name: Build Oman Smart ERP (Android APK + Windows EXE)

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    name: 1. Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project and Compile APK
        run: |
          rm -rf app_build
          flutter create --platforms=android --project-name oman_smart_erp --org om.muscat.erp app_build
          rm -rf app_build/test
          FOUND_DART=$(find . -maxdepth 2 -name "*.dart" ! -path "./app_build/*" | head -n 1)
          if [ -n "$FOUND_DART" ]; then
            echo "Injecting Dart file: $FOUND_DART"
            cp "$FOUND_DART" app_build/lib/main.dart
          fi
          cd app_build
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: 1-Oman-Smart-ERP-Android-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

  build-windows-exe:
    name: 2. Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter on Windows
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create and Build Windows EXE
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name oman_smart_erp app_win
          Remove-Item -Recurse -Force app_win/test -ErrorAction SilentlyContinue
          $dartFile = Get-ChildItem -Path . -Filter *.dart -File | Select-Object -First 1
          if ($null -ne $dartFile) {
            Copy-Item $dartFile.FullName -Destination "app_win/lib/main.dart" -Force
          }
          Set-Location app_win
          flutter build windows --release

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: 2-Oman-Smart-ERP-Windows-EXE
          path: app_win/build/windows/x64/runner/Release/
